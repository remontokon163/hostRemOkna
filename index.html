    <!-- СКРИПТ: ВТОРОЙ ТЕЛЕФОН РЯДОМ С ПЕРВЫМ -->

    <script>
    (function () {
        var SECOND_HREF = 'tel:+79674828298';
        var SECOND_TEXT  = '+7 (967) 482-82-98';
        var MARK = 'data-second-phone';

        function decorate() {
            // 1) Все ссылки с первым номером — добавляем второй рядом
            var links = document.querySelectorAll('a[href*="9371008097"]');
            for (var i = 0; i < links.length; i++) {
                var a = links[i];
                if (a.getAttribute(MARK)) continue;
                a.setAttribute(MARK, '1');

                var sep = document.createTextNode(' · ');
                var b = document.createElement('a');
                b.href = SECOND_HREF;
                b.textContent = SECOND_TEXT;
                b.setAttribute('style',
                    'color:inherit;font-weight:inherit;text-decoration:inherit;');

                a.parentNode.insertBefore(sep, a.nextSibling);
                a.parentNode.insertBefore(b, sep.nextSibling);
            }

            // 2) Если номер встречается просто текстом (без ссылки) — тоже добавим
            var all = document.querySelectorAll('body *');
            for (var j = 0; j < all.length; j++) {
                var el = all[j];
                if (el.getAttribute && el.getAttribute(MARK)) continue;
                if (el.children && el.children.length > 0) continue; // только "листовые" элементы
                if (!el.textContent || el.textContent.indexOf('100-80-97') === -1) continue;
                el.setAttribute(MARK, '1');
                el.innerHTML = el.innerHTML.replace(
                    /(100-80-97)/,
                    '$1 · <a href="' + SECOND_HREF + '" style="color:inherit;font-weight:inherit;">' + SECOND_TEXT + '</a>'
                );
            }
        }

        if (window.MutationObserver) {
            new MutationObserver(decorate).observe(document.documentElement, {
                childList: true,
                subtree: true
            });
        }
        document.addEventListener('DOMContentLoaded', decorate);
        decorate();
    })();
    </script>

    <!-- СКРИПТ ДОБАВЛЕНИЯ ГАЛОЧКИ СОГЛАСИЯ -->
    <!-- ========================================== -->
    <script>
    (function () {
        var CHECK_ID = 'my-consent-check';

        function findSubmitBtn(root) {
            var buttons = root.querySelectorAll('button');
            for (var i = 0; i < buttons.length; i++) {
                var t = (buttons[i].textContent || '').toLowerCase();
                if (t.indexOf('отправ') !== -1 || t.indexOf('заказать') !== -1) {
                    return buttons[i];
                }
            }
            return null;
        }

        function insertConsent(form) {
            // Галочка уже есть и жива — выходим
            if (form.querySelector('#' + CHECK_ID)) return;

            var btn = findSubmitBtn(form);
            if (!btn) return;

            var wrapper = document.createElement('div');
            wrapper.id = 'consent-wrapper';
            wrapper.style.cssText =
                'width:100%;display:flex;align-items:center;justify-content:center;' +
                'gap:10px;margin:15px 0;padding:0 10px;box-sizing:border-box;';

            wrapper.innerHTML =
                '<input type="checkbox" id="' + CHECK_ID + '" required ' +
                'style="width:20px;min-width:20px;height:20px;margin:0;cursor:pointer;' +
                'accent-color:#bafa21;display:block;" />' +
                '<label for="' + CHECK_ID + '" ' +
                'style="color:#121212;font-size:14px;margin:0;cursor:pointer;' +
                'line-height:1.2;text-align:left;font-weight:normal;">' +
                'Я согласен на обработку персональных данных' +
                '</label>';

            btn.parentNode.insertBefore(wrapper, btn);

            // Страховка: блокируем отправку формы без галочки
            form.addEventListener('submit', function (e) {
                var cb = document.getElementById(CHECK_ID);
                if (cb && !cb.checked) {
                    e.preventDefault();
                    e.stopImmediatePropagation();
                    alert('Пожалуйста, поставьте галочку согласия на обработку персональных данных.');
                }
            }, true);
        }

        function scan() {
            var forms = document.querySelectorAll('form');
            for (var i = 0; i < forms.length; i++) {
                insertConsent(forms[i]);
            }
        }

        // Следим за DOM: если Vue перерисует форму и затрёт галочку — вставим заново
        if (window.MutationObserver) {
            new MutationObserver(scan).observe(document.documentElement, {
                childList: true,
                subtree: true
            });
        }

        document.addEventListener('DOMContentLoaded', scan);
        scan();
    })();
    </script>
