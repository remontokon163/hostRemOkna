    <!-- ========================================== -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Ждем, пока Vue отрисует форму
            setTimeout(function() {
                var buttons = document.querySelectorAll('button');
                var submitBtn = null;
                
                // Ищем кнопку "Отправить"
                for (var i = 0; i < buttons.length; i++) {
                    if (buttons[i].innerText.includes('Отправить')) {
                        submitBtn = buttons[i];
                        break;
                    }
                }
                
                // Если нашли кнопку и галочки еще нет - вставляем
                if (submitBtn && !document.getElementById('consent-wrapper')) {
                    var wrapper = document.createElement('div');
                    wrapper.id = 'consent-wrapper';
                    wrapper.style.cssText = 'width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; margin: 15px 0; padding: 0 10px; box-sizing: border-box;';
                    
                    wrapper.innerHTML = `
                        <input type="checkbox" id="my-consent-check" required style="width: 20px !important; height: 20px !important; min-width: 20px !important; margin: 0 !important; cursor: pointer; accent-color: #bafa21; display: block !important;" />
                        <label for="my-consent-check" style="color: #121212 !important; font-size: 14px !important; margin: 0 !important; cursor: pointer; line-height: 1.2 !important; text-align: left !important; font-weight: normal !important;">
                            Я согласен на обработку персональных данных
                        </label>
                    `;
                    
                    submitBtn.parentNode.insertBefore(wrapper, submitBtn);
                }

                // Перехватываем отправку формы, чтобы проверить галочку
                var forms = document.querySelectorAll('form');
                forms.forEach(function(form) {
                    if (!form.dataset.hasConsentCheck) {
                        form.dataset.hasConsentCheck = "true";
                        
                        // Перехватываем событие на ранней стадии (до Vue)
                        form.addEventListener('submit', function(e) {
                            var checkbox = document.getElementById('my-consent-check');
                            if (checkbox && !checkbox.checked) {
                                e.preventDefault();
                                e.stopPropagation(); // Останавливаем Vue
                                alert('Пожалуйста, поставьте галочку согласия на обработку персональных данных.');
                            }
                        }, true); // Флаг true означает "перехватить первым"
                    }
                });
            }, 1000); // Даем Vue 1 секунду на загрузку
        });
    </script>
